<!doctype html>
<html lang="pt-BR" data-tema="laranja">
<head>
  <meta charset="utf-8">
  <!-- viewport: manda o celular usar a largura real da tela, sem "zoom out" -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- a cor da barra do celular. O app.js troca esta linha quando a
       pessoa muda de perfil, para combinar com a cor da tela. -->
  <meta name="theme-color" content="#f4551e">
  <title>Treino</title>

  <!-- manifest: a ficha do app (nome, cor, ícone). É o que deixa o
       celular oferecer "adicionar à tela inicial". -->
  <link rel="manifest" href="manifest.json">
  <!-- o iPhone ignora o manifest e usa estas duas linhas -->
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Treino">

  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- Tudo o que aparece na tela é desenhado pelo app.js dentro
       destas caixas vazias. O HTML aqui é só o esqueleto. -->

  <header id="cabecalho"></header>

  <main id="conteudo"></main>

  <footer id="rodape"></footer>

  <!-- Painel que sobe por cima: histórico, lista de treinos ou edição -->
  <div id="painel" class="oculto"></div>

  <!-- Barra do cronômetro, fixa no pé da tela -->
  <div id="cronometro" class="oculto"></div>

  <!-- Faixa de aviso e de "Desfazer", aparece por alguns segundos -->
  <div id="desfazer" class="oculto"></div>

  <!-- Entrada do arquivo de backup, também invisível -->
  <input type="file" id="arquivo-backup" accept=".json,application/json" hidden>

  <script src="dados-iniciais.js"></script>
  <script src="app.js"></script>
</body>
</html>
